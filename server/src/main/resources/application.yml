spring:
  application:
    name: polyglot-ai-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${POLYGLOT_DB_URL:jdbc:postgresql://localhost:5433/polyglot}
    username: ${POLYGLOT_DB_USER:polyglot}
    password: ${POLYGLOT_DB_PASSWORD:polyglot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    mongodb:
      uri: ${POLYGLOT_MONGO_URI:mongodb://localhost:27017/polyglot}
  # JWT validation activates when issuer-uri is set; leave blank in dev to skip.
  # The auth feature PR (see docs/specs/) will populate this and move SecurityConfig
  # into the owning bounded context.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${POLYGLOT_JWT_ISSUER_URI:}

server:
  port: ${POLYGLOT_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.polyglotai: DEBUG

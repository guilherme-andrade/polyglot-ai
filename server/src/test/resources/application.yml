spring:
  # The user context now persists to PostgreSQL, so context-loading tests need a real
  # database. Tests provide one via Testcontainers (see AbstractPostgresIntegrationTest),
  # so DataSource / JPA / Flyway autoconfig stay ENABLED here. Mongo is not used yet, so
  # its autoconfig stays excluded to avoid requiring a Mongo container.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
